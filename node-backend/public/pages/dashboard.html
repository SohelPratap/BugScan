<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - BugScan</title>
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header>
        <div class="nav-left">
            <button class="hamburger" onclick="toggleSidebar()">☰</button>
            <div class="logo-text">
                <i class="fas fa-bug"></i> <span>BugScan</span>
            </div>
        </div>
        <div class="nav-right">
            <span id="userGreeting" class="user-greeting"></span>
            <button onclick="logout()" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <button onclick="navigate('dashboard')"><i class="fas fa-home"></i> Dashboard</button>
            <button onclick="navigate('newscan')"><i class="fas fa-plus-circle"></i> New Scan</button>
            <button onclick="navigate('reports')"><i class="fas fa-file-alt"></i> Reports</button>
            <button onclick="navigate('services')"><i class="fas fa-cogs"></i> Services</button>
            <button onclick="navigate('about')"><i class="fas fa-info-circle"></i> About</button>
        </aside>

        <main class="main-content">
            <div id="content">
                <h1>Welcome to BugScan! 👋</h1>
                <p>Start by creating a new security scan or view your previous reports.</p>
                <div class="action-buttons">
                    <button onclick="navigate('newscan')" class="btn-primary">
                        <i class="fas fa-plus"></i> New Scan
                    </button>
                    <button onclick="navigate('reports')" class="btn-secondary">
                        <i class="fas fa-chart-bar"></i> View Reports
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/api-config.js"></script>
    <script src="../assets/js/dashboard.js"></script>
</body>
</html>
