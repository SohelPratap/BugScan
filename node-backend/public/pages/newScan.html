<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Scan - BugScan</title>
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/newScan.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- Dashboard header (loaded via JS) -->
    <div id="header-container"></div>

    <div class="container">
        <!-- Sidebar (loaded via JS) -->
        <aside class="sidebar" id="sidebar">
            <button onclick="window.location.href='dashboard.html'"><i class="fas fa-home"></i> Dashboard</button>
            <button class="active" onclick="window.location.href='newScan.html'"><i class="fas fa-plus-circle"></i> New Scan</button>
            <button onclick="window.location.href='reports.html'"><i class="fas fa-file-alt"></i> Reports</button>
            <button onclick="window.location.href='services.html'"><i class="fas fa-cogs"></i> Services</button>
            <button onclick="window.location.href='about.html'"><i class="fas fa-info-circle"></i> About</button>
        </aside>

        <main class="main-content">
            <div id="content" class="scan-wrapper">

                <h1><i class="fas fa-search"></i> New Scan</h1>

                <div class="scan-input-group">
                    <i class="fas fa-globe"></i>
                    <input type="text" id="scanUrl" placeholder="Enter website URL (e.g. https://example.com)">
                </div>

                <div class="scan-buttons">
                    <button onclick="startScan('light')" class="btn-light">
                        <i class="fas fa-bolt"></i> Light Scan
                    </button>
                    <button onclick="startScan('deep')" class="btn-deep">
                        <i class="fas fa-search-plus"></i> Deep Scan
                    </button>
                </div>

                <!-- Scan results appear here after a scan completes -->
                <div id="scan-results" style="display:none;">
                    <h2 class="results-title"><i class="fas fa-shield-alt"></i> Scan Results</h2>
                    <div id="results-summary" class="results-summary"></div>
                    <div id="results-content" class="results-content"></div>
                </div>

                <h3 class="comparison-title">Scan Type Comparison</h3>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Tests Performed</th>
                                <th>Light Scan</th>
                                <th>Deep Scan</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td>Fingerprint web server software</td><td>✔️</td><td>✔️</td></tr>
                            <tr><td>Analyze HTTP headers for security misconfiguration</td><td>✔️</td><td>✔️</td></tr>
                            <tr><td>Check the security of HTTP cookies</td><td>✔️</td><td>✔️</td></tr>
                            <tr><td>Check for SQL Injection</td><td>❌</td><td>✔️</td></tr>
                            <tr><td>Check for Cross-Site Scripting (XSS)</td><td>❌</td><td>✔️</td></tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </main>
    </div>

    <script src="../assets/js/api-config.js"></script>
    <script src="../assets/js/newScan.js"></script>
    <script>
        // Load dashboard header and set greeting
        fetch("../components/dheader.html")
            .then(r => r.text())
            .then(html => {
                document.getElementById("header-container").innerHTML = html;
                const name = localStorage.getItem("userName");
                const el = document.getElementById("userGreeting");
                if (el && name) el.textContent = `Welcome, ${name}!`;
            });

        function toggleSidebar() {
            document.querySelector(".sidebar").classList.toggle("show");
        }

        function logout() {
            if (confirm("Are you sure you want to logout?")) {
                API.logout();
                window.location.href = "login.html";
            }
        }
    </script>
</body>
</html>
