<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BugScan</title>
    <link rel="stylesheet" href="../assets/css/loginsignup.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="background-blur"></div>
    <div class="container">
        <h2><i class="fas fa-bug"></i> BugScan</h2>
        <p class="subtitle">Login to your account</p>

        <div id="messageBox" class="message-box" style="display:none;"></div>

        <div id="loading" class="loading" style="display: none;">
            <i class="fas fa-spinner fa-spin"></i> Logging in...
        </div>

        <form id="loginForm">
            <div class="input-group">
                <i class="fa fa-envelope"></i>
                <input type="email" id="email" placeholder="Email (e.g. user@example.com)" required>
            </div>

            <div class="input-group">
                <i class="fa fa-lock"></i>
                <input type="password" id="password" placeholder="Password" required>
                <i class="fa fa-eye-slash toggle-password" id="togglePassword" title="Show/hide password"></i>
            </div>

            <button type="submit" class="btn-submit">Login</button>
        </form>

        <p class="signup-link">Don't have an account? <a href="signup.html">Sign Up Here</a></p>
    </div>

    <script src="../assets/js/api-config.js"></script>
    <script src="../assets/js/login.js"></script>
</body>
</html>
